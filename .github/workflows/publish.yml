name: publish
# Manual-only to avoid accidental PyPI releases: pushing a `v*` tag no longer
# auto-publishes. Trigger deliberately from the Actions tab (Run workflow) when
# a release is actually intended.
on:
  workflow_dispatch:

permissions:
  contents: read  # the test gate; build-and-publish asks for more below

jobs:
  # Tests gate: the same workflows CI runs, on the same commit, so the gate
  # cannot drift from CI (base matrix on Linux and macOS, every extras job,
  # the macOS 14 arm64 geo job, and R CMD check of the R package in r/,
  # which ships with the same version and tag).
  test-base:
    uses: ./.github/workflows/test.yml
  test-extras:
    uses: ./.github/workflows/test-extras.yml
  r-check:
    uses: ./.github/workflows/r-check.yml

  build-and-publish:
    needs: [test-base, test-extras, r-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for PyPI Trusted Publishing (OIDC)
      contents: write   # for gh release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - name: Build wheel + sdist
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
