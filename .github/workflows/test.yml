name: test (base)
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:  # run on any branch from the Actions tab
  workflow_call:      # publish.yml runs this as its test gate

jobs:
  test-base:
    # A job takes 2-4 minutes; a hung test fails it after 30 instead of GitHub's 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Base install only: deselect everything that needs an optional extra, and the
      # golden tests (their references are not in git; they skip without them anyway).
      BASE_MARKERS: not extras and not geo and not rda and not hdf4 and not nc and not slow and not golden
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e .[dev]
      - run: pytest tests/ -v -m "$BASE_MARKERS" --tb=short
      - name: Tests ignore the caller's SPACESCANS_* variables
        # tests/conftest.py removes them for every test; this run proves it.
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        env:
          SPACESCANS_DATA_DIR: /nonexistent/spacescans-data
          SPACESCANS_OUTPUT_DIR: /nonexistent/spacescans-output
        run: pytest tests/ -q -m "$BASE_MARKERS" --tb=short
