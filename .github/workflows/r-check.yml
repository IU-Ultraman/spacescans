name: R CMD check
# The R package in r/, the client of the Python bridge, on its supported platform:
# Apple silicon (macOS 14), R 4.6, CPython 3.12. The Python package from the same commit is
# installed and given to the tests as SPACESCANS_PYTHON, so the bridge tests run instead of
# skipping. The gate: no ERROR and no WARNING except the licence one, which stays until a
# licence is chosen (.github/scripts/r-check-status.sh). NOTEs do not fail it.
on:
  push:
    branches: [main]
    paths: ["r/**", "src/**", "pyproject.toml", ".github/workflows/r-check.yml", ".github/scripts/r-check-status.sh"]
  pull_request:  # src/** holds the bridge the package talks to
    branches: [main]
    paths: ["r/**", "src/**", "pyproject.toml", ".github/workflows/r-check.yml", ".github/scripts/r-check-status.sh"]
  workflow_dispatch:  # run on any branch from the Actions tab
  workflow_call:      # publish.yml runs this as its R gate (path filters do not apply)

permissions:
  contents: read

jobs:
  r-cmd-check:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: r
    env:
      NOT_CRAN: "true"   # testthat runs skip_on_cran() tests too
    steps:
      - uses: actions/checkout@v4

      - name: Fail unless the runner is Apple silicon
        run: |
          sw_vers
          test "$(uname -m)" = arm64

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install this commit's Python package for the bridge tests (geo extra, wheels only)
        working-directory: .
        run: |
          python -m venv "$RUNNER_TEMP/spacescans-venv"
          py="$RUNNER_TEMP/spacescans-venv/bin/python"
          "$py" -m pip install --upgrade pip
          "$py" -m pip install --only-binary=:all: -e ".[geo]"
          "$py" -c "import spacescans; print('spacescans', spacescans.__version__)"
          echo "SPACESCANS_PYTHON=$py" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"

      - uses: r-lib/actions/setup-pandoc@v2   # in case a vignette needs it

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r   # Imports and Suggests from r/DESCRIPTION, CRAN binaries

      - name: R CMD build and R CMD check --no-manual
        run: |
          R --version | head -n 1
          R CMD build --no-manual .
          R CMD check --no-manual spacescans_*.tar.gz || echo "R CMD check exited with status $?"
          bash ../.github/scripts/r-check-status.sh spacescans.Rcheck/00check.log

      - name: Show the test output
        if: failure()
        run: cat spacescans.Rcheck/tests/testthat.Rout.fail spacescans.Rcheck/tests/testthat.Rout 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: r-cmd-check
          path: r/spacescans.Rcheck
          if-no-files-found: ignore
