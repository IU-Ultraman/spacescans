name: test (extras)
on:
  push: {branches: [main]}
  workflow_dispatch:  # run on any branch from the Actions tab
  workflow_call:      # publish.yml runs this as its test gate

jobs:
  test-geo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e .[geo,dev]
      - run: pytest tests/ -v -m "geo and not golden" --tb=short

  test-geo-macos-arm64:
    # The R package's target platform: Apple Silicon, macOS 14 or later,
    # CPython 3.12, PyPI wheels only. Wheels only also keeps pip from building
    # an sdist whose wheels need a newer macOS (rasterio 1.5.2 needs macOS 15,
    # so macOS 14 gets the 1.5.1 wheel).
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Install with the geo extra, wheels only
        run: |
          pip install --only-binary=:all: -e ".[geo,dev]"
      - name: Record the platform and the geo stack
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          python -c "import platform, rasterio, pyproj, shapely, exactextract; print(platform.platform(), '| rasterio', rasterio.__version__, '| GDAL', rasterio.__gdal_version__, '| PROJ', pyproj.proj_version_str, '| GEOS', shapely.geos_version_string, '| exactextract', exactextract.__version__)"
      # Base and geo tests; rda, hdf4 and nc tests need extras not installed here.
      - run: pytest tests/ -v -m "not rda and not hdf4 and not nc and not golden" --tb=short

  test-rda:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e .[rda,dev]
      - run: pytest tests/ -v -m "rda and not golden" --tb=short

  test-hdf4:
    runs-on: ubuntu-24.04  # macOS HDF4 too painful for CI; documented only.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libhdf4-dev
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e .[hdf4,dev]
      - run: pytest tests/ -v -m "hdf4 and not golden" --tb=short

  test-nc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e .[nc,geo,dev]
      - run: pytest tests/ -v -m "nc and not golden" --tb=short

  test-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libhdf4-dev
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e .[all,dev]
      # Golden tests need references kept out of git (tests/golden/README.md).
      - run: pytest tests/ -v -m "not golden" --tb=short
