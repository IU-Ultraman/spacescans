name: acag_270m_demo
linkage_pattern: acag_multi          # C4: 8 species × {plain, FromBiomass} biweekly NetCDF + C3 weights → patient × pollutant
geometry_type: raster                # C3 only: input data geometry

source:                              # C4: C3-produced weight table (demo)
  file: output/python_v2/270m/ACAG/C3/buffer270m_acag_weights_demo100k.parquet

buffer:
  patient_file: demo_patients_conus_fast_100000.parquet
  patient_adapter: demo_conus
  buffer_m: 270

exposure:                            # C4: root holding <SPECIES>/BiWeekly/ and <SPECIES>_bm/BiWeekly/
  file: ACAG/C4/xNorthAmerica        # acag_multi walks every species dir itself; value_cols is per-file
  join_col: grid_id
  value_cols:
    - value
  start_col: start_date
  end_col: end_date

time:
  years: [2013, 2014, 2015, 2016, 2017, 2018, 2019]
  temporal_resolution: biweekly
  temporal_mode: yearly
  output_grouping: patient            # v1/CLI default; the web runner injects 'episode'

engine:
  backend: duckdb

output:                              # 24 columns: pm25 … ss, each with _bm and _nbm
  path: output/python_v2/270m/ACAG/C4/acag_270m_demo100k.parquet
  format: parquet
