name: temis_grid_demo_task_en-temis
linkage_pattern: grid_weights
geometry_type: raster
source:
  file: TEMIS/C3/temis_template.tif
buffer:
  patient_file: /app/data/tasks/tier2-golden-temis/input.parquet
  patient_adapter: demo_conus
  buffer_m: 270
transforms:
- type: spatial_fix
  target: source
  fix_type: assign_crs
  crs: EPSG:4326
- type: spatial_fix
  target: source
  fix_type: set_extent
  extent:
  - -180.0
  - 180.0
  - -90.0
  - 90.0
engine:
  backend: duckdb
plugin: temis
output:
  path: /app/data/tasks/tier2-golden-temis/output/c3_temis.parquet
  format: parquet
