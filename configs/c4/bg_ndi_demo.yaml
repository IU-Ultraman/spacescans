name: bg_ndi_demo
linkage_pattern: yearly_areal_bg_vintage  # dispatches between 2010 and 2020 BG vintages
geometry_type: polygon

# C3 BG weights (2010 vintage) — used for exposure rows with bg_vintage=2010
# (ACS end_year 2012-2019 / index_year 2010-2017)
source:
  file: output/python_v2/270m/BG_US/C3/buffer270mBG25m_demo100k.parquet
  join_col: GEOID10

# C3 BG weights (2020 vintage) — used for exposure rows with bg_vintage=2020
# (ACS end_year 2020-2024 / index_year 2018-2022)
source_2020:
  file: output/python_v2/270m/BG_US_2020/C3/buffer270mBG25m_2020_demo100k.parquet
  join_col: GEOID

buffer:
  patient_file: data_full/demo_patients_conus_fast_100000.parquet
  patient_adapter: demo_conus
  buffer_m: 270

# New nationwide NDI: ACS 5-year 2008-2012 through 2020-2024, dual-vintage BGs.
# Each row carries either bg_fips_2010 OR bg_fips_2020 (mutually exclusive),
# and the bg_vintage column (int: 2010 or 2020) drives the join dispatch.
# Join key = index_year (NOT acs_end_year — per collaborator's spec).
exposure:
  file: data_full/BG_NDI/C4/ndi_bg_acs5_2008_2012_to_2020_2024_nationwide_summaryfile_xgboost.rds
  vintage_col: bg_vintage
  join_col_2010: bg_fips_2010
  join_col_2020: bg_fips_2020
  value_cols: [ndi]
  year_col: index_year

time:
  years: [2013, 2014, 2015, 2016, 2017, 2018, 2019]
  temporal_resolution: yearly
  temporal_mode: yearly

engine:
  backend: duckdb

output:
  path: output/python_v2/270m/BG_US/C4/ndi_demo100k.parquet
  format: parquet
