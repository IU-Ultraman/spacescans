  # identifier (vs 'GEOID10' in 2010 vintage). Verify with: ogrinfo -so <shp> | grep GEOID
  # If your shapefile uses 'GEOID20' instead, change this line.
  join_col: GEOID
buffer:
  patient_file: data_full/demo_patients_conus_fast_100000.parquet
  patient_adapter: demo_conus
  buffer_m: 270
  raster_res_m: 25
  # raster_cache_dir: not used by boundary_overlap_fast (no per-target cache).
engine:
  backend: duckdb
output:
  path: output/python_v2/270m/BG_US_2020/C3/buffer270mBG25m_2020_demo100k.parquet
  format: parquet
