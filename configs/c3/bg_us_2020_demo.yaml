  # release was 2022, so any TIGER >= 2022 works — picking 2024 for latest revision).
  # 50 states + DC, excluding territories (PR/VI/GU/AS/MP).
  # Download via: bash scripts/download_bg_2020_shapefiles.sh
  file:
  - data_full/BG_FL/C3/tiger2024_bg_states/tl_2024_01_bg/tl_2024_01_bg.shp
  - data_full/BG_FL/C3/tiger2024_bg_states/tl_2024_02_bg/tl_2024_02_bg.shp
