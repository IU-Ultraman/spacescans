[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacescans"
version = "0.3.3"
description = "Link time-referenced geolocation data (location episodes) to the spatial and contextual exposome: spatial weights (C3) and day-weighted linkage (C4), per participant or per episode"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Regenstrief Institute"}]
keywords = ["exposome", "geospatial", "ehr", "patient-exposure-linkage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic >= 2.0",
    "pyyaml",
    "pandas >= 2.0",
    "numpy",
    # Tested on 1.x; 2.0 (2026-10-21) changed connection semantics and is not validated yet.
    "duckdb >= 0.9, < 2",
    "pyarrow",
    "mercantile >= 1.2",
]

[project.optional-dependencies]
geo = [
    "geopandas >= 0.14",
    "rasterio >= 1.3",
    "shapely >= 2.0",
    "exactextract >= 0.2",
]
rda = ["pyreadr"]
hdf4 = ["pyhdf"]
nc = ["xarray", "netCDF4"]
all = [
    "geopandas >= 0.14",
    "rasterio >= 1.3",
    "shapely >= 2.0",
    "exactextract >= 0.2",
    "mercantile >= 1.2",
    "pyreadr",
    "pyhdf",
    "xarray",
    "netCDF4",
]
dev = [
    "pytest >= 7.0",
    "pytest-xdist",
    "ruff",
    "jsonschema >= 4.21",
]

[project.scripts]
spacescans = "spacescans.cli:main"

[project.urls]
Homepage = "https://www.spacescans.com"
Repository = "https://github.com/IU-Ultraman/spacescans"
Issues = "https://github.com/IU-Ultraman/spacescans/issues"
Changelog = "https://github.com/IU-Ultraman/spacescans/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spacescans*"]
exclude = ["tests*", "__pycache__*"]

[tool.setuptools.package-data]
spacescans = [
    "resources/configs/quickstart/*.yaml",
    "resources/configs/templates/c3/*.yaml",
    "resources/configs/templates/c4/*.yaml",
    "resources/data/*.parquet",
    "resources/data/*.shp",
    "resources/data/*.shx",
    "resources/data/*.dbf",
    "resources/data/*.prj",
    "resources/data/*.cpg",
    "catalog/*.json",
    "catalog/templates/c3/*.yaml",
    "catalog/templates/c4/*.yaml",
    "data/manifest.json",
    "data/manifest.schema.json",
    "orchestrate/memory_table.csv",
    "py.typed",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "geo: tests requiring [geo] extra",
    "rda: tests requiring [rda] extra",
    "hdf4: tests requiring [hdf4] extra",
    "nc: tests requiring [nc] extra",
    "extras: any test requiring optional extras",
    "slow: tests > 5s",
    "golden: needs the tier-2 golden references named by SPACESCANS_GOLDEN_DIR (not in git); skipped without them, deselected in CI",
]
